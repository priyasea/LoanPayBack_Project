<!DOCTYPE html>
<html>
<head>
    <title>Loan Payback Prediction</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 40px auto;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        button {
            margin-top: 15px;
            padding: 8px 12px;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Loan Payback Prediction</h2>

<form id="predict-form">
    <label>Employment Status:
        <select id="employment_status">
            <option value="employed">Employed</option>
            <option value="self-employed">Self-employed</option>
            <option value="unemployed">Unemployed</option>
            <option value="student">Student</option>
            <option value="retired">Retired</option>
        </select>
    </label>

    <label>Education Level:
        <select id="education_level">
            <option value="high_school">High School</option>
            <option value="bachelors">Bachelors</option>
            <option value="masters">Masters</option>
            <option value="phd">PhD</option>
            <option value="other">Other</option>
        </select>
    </label>

    <label>Grade Subgrade:
        <select id="grade_subgrade">
        <option value="a1">A1</option>
        <option value="a2">A2</option>
        <option value="a3">A3</option>
        <option value="a4">A4</option>
        <option value="a5">A5</option>

        <option value="b1">B1</option>
        <option value="b2" selected>B2</option>
        <option value="b3">B3</option>
        <option value="b4">B4</option>
        <option value="b5">B5</option>

        <option value="c1">C1</option>
        <option value="c2">C2</option>
        <option value="c3">C3</option>
        <option value="c4">C4</option>
        <option value="c5">C5</option>

        <option value="d1">D1</option>
        <option value="d2">D2</option>
        <option value="d3">D3</option>
        <option value="d4">D4</option>
        <option value="d5">D5</option>

        <option value="e1">E1</option>
        <option value="e2">E2</option>
        <option value="e3">E3</option>
        <option value="e4">E4</option>
        <option value="e5">E5</option>

        <option value="f1">F1</option>
        <option value="f2">F2</option>
        <option value="f3">F3</option>
        <option value="f4">F4</option>
        <option value="f5">F5</option>
    </select>


    </label>

    <label>Loan Purpose:
        <select id="loan_purpose">
            <option value="car">Car</option>
            <option value="home">Home</option>
            <option value="education">Education</option>
            <option value="business">Business</option>
            <option value="medical">Medical</option>
            <option value="vacation">Vacation</option>
            <option value="other">Other</option>
            <option value="debt_consolidation">Debt Consolidation</option>
        </select>
    </label>

    <label>Credit Score:
        <input type="number" id="credit_score" value="720">
    </label>

    <label>Annual Income:
        <input type="number" id="annual_income" value="850000">
    </label>

    <label>Debt-to-Income Ratio:
        <input type="number" step="0.01" id="debt_to_income_ratio" value="0.28">
    </label>

    <label>Loan Amount:
        <input type="number" id="loan_amount" value="300000">
    </label>

    <label>Interest Rate:
        <input type="number" step="0.1" id="interest_rate" value="11.5">
    </label>

    <button type="submit">Predict</button>
</form>

<div id="result"></div>

<script>
document.getElementById("predict-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const payload = {
        employment_status: document.getElementById("employment_status").value,
        education_level: document.getElementById("education_level").value,
        grade_subgrade: document.getElementById("grade_subgrade").value,
        loan_purpose: document.getElementById("loan_purpose").value,
        credit_score: Number(document.getElementById("credit_score").value),
        annual_income: Number(document.getElementById("annual_income").value),
        debt_to_income_ratio: Number(document.getElementById("debt_to_income_ratio").value),
        loan_amount: Number(document.getElementById("loan_amount").value),
        interest_rate: Number(document.getElementById("interest_rate").value)
    };
    
    console.log("Payload sent to API:", payload);

    const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    const result = await response.json();

    document.getElementById("result").innerText =
        `Probability: ${result.loan_paid_back_probability}
         | Loan Paid Back: ${result.loan_paid_back}`;
});
</script>

</body>
</html>
